# The whole FactsLens stack on the Hostinger VPS:  docker compose up -d --build
# Kafka and PostgreSQL are Aiven services, reached with the settings in .env.
# Memory limits keep the 8 GB VPS safe; raise them only after measuring.
#
# HTTPS: the VPS template ("Ubuntu 24.04 with Docker and Traefik") already runs Traefik on
# ports 80/443 (/docker/traefik, host network, Let's Encrypt resolver "letsencrypt",
# HTTP redirects to HTTPS). The api service below registers itself with it through labels.
# SITE_DOMAIN defaults to the VPS hostname; set it in .env once our own domain points here.

x-service: &service
  image: factslens:latest
  env_file: .env
  volumes:
    - ./secrets:/app/secrets:ro # Aiven Kafka CA certificate
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  ingest:
    <<: *service
    build: .
    command: ["python", "-m", "factslens.ingest"]
    mem_limit: 512m

  detector:
    <<: *service
    command: ["python", "-m", "factslens.detector"]
    depends_on: [ingest] # ingest applies the database migrations
    mem_limit: 2g

  enrich:
    <<: *service
    command: ["python", "-m", "factslens.enrich"]
    depends_on: [detector] # detector applies the cluster tables
    volumes:
      - ./secrets:/app/secrets:ro
      - ./ground_truth:/app/eval/ground_truth/data:ro # copied by deploy.sh; not in git
    mem_limit: 512m

  api:
    <<: *service
    command: ["python", "-m", "factslens.api", "--host", "0.0.0.0", "--port", "8000"]
    depends_on: [ingest]
    expose: ["8000"]
    mem_limit: 512m
    labels:
      - traefik.enable=true
      - traefik.http.routers.factslens.rule=Host(`${SITE_DOMAIN:-srv2159312.hstgr.cloud}`)
      - traefik.http.routers.factslens.entrypoints=websecure
      - traefik.http.routers.factslens.tls.certresolver=letsencrypt
      - traefik.http.services.factslens.loadbalancer.server.port=8000
